name: Stratum CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stratum_user
          POSTGRES_PASSWORD: stratum_password
          POSTGRES_DB: stratum_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://stratum_user:stratum_password@localhost:5432/stratum_test
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run schema drift unit tests
        working-directory: backend
        run: |
          pytest tests/test_schema_drift.py -v

      - name: Run auth tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://stratum_user:stratum_password@localhost:5432/stratum_test
        run: |
          pytest tests/test_auth.py -v

      - name: Run health tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://stratum_user:stratum_password@localhost:5432/stratum_test
        run: |
          pytest tests/test_health.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build ./backend -t stratum-backend:${{ github.sha }}

      - name: Build frontend image
        run: |
          docker build ./frontend -t stratum-frontend:${{ github.sha }}

      - name: Verify images built
        run: |
          docker images | grep stratum

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"